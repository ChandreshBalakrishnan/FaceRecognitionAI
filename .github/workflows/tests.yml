name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # headless build: CI has no display, and cv2.face still ships in it
          pip install numpy "opencv-contrib-python-headless<5" onnxruntime websockets pyflakes

      - name: Lint
        run: python -m pyflakes backend/*.py

      - name: Tests
        working-directory: backend
        # --no-models skips the two ~92 MB downloads; everything else is pure
        # logic and runs for real.
        run: python test_pipeline.py --no-models

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check the extension
        run: |
          for f in extension/*.js; do node --check "$f"; done
          python3 -c "import json; json.load(open('extension/manifest.json'))"
